name: Refresh source reachability
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-source-status
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check official source URLs
        run: node scripts/check-sources.mjs
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- data/source-status.json; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-status.json
          git commit -m "chore: refresh source reachability snapshot"
          git push