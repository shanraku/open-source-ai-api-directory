name: Discover and refresh model catalogue
on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-model-catalogue
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Discover models from public catalogues
        run: node scripts/discover-models.mjs
      - name: Commit refreshed model snapshot
        run: |
          if git diff --quiet -- data/discovered-models.json; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovered-models.json
          git commit -m "chore: refresh discovered model catalogue"
          git push
